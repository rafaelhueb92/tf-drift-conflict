name: Terraform Drift + Apply + Datadog

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: 'Destruct?'
        required: true
        default: 'false'
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: [master]
  
permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    if: ${{ github.event.inputs.destroy == 'false' }}
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
      DATADOG_SITE: ${{ secrets.DATADOG_SITE || 'us5.datadoghq.com' }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform/state.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -out=tfplan
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          [ "$exit_code" -eq 0 ] || [ "$exit_code" -eq 2 ] || exit 1

      - name: Terraform Apply
        id: apply
        if: steps.plan.outputs.exit_code == '2' || steps.plan.outputs.exit_code == '0'
        run: terraform apply -auto-approve tfplan

      # --- DATADOG METRICS SECTION ---

      - name: Send Success & Drift Metrics
        if: success()
        shell: bash
        run: |
          TS=$(date +%s)
          TAGS="\"repo:${{ github.repository }}\",\"workflow:${{ github.workflow }}\",\"branch:${{ github.ref_name }}\",\"event:${{ github.event_name }}\""
          
          # 1. Send General Success Metric
          curl -s -X POST "https://api.${DATADOG_SITE}/api/v1/series" -H "DD-API-KEY: ${DD_API_KEY}" -H "Content-Type: application/json" \
            -d "{\"series\": [{\"metric\": \"terraform.pipeline_success\", \"points\": [[$TS, 1]], \"type\": \"count\", \"tags\": [$TAGS]}]}"

          # 2. Send Drift Metric if exit code was 2
          if [ "${{ steps.plan.outputs.exit_code }}" = "2" ]; then
            curl -s -X POST "https://api.${DATADOG_SITE}/api/v1/series" -H "DD-API-KEY: ${DD_API_KEY}" -H "Content-Type: application/json" \
              -d "{\"series\": [{\"metric\": \"terraform.drift_detected\", \"points\": [[$TS, 1]], \"type\": \"count\", \"tags\": [$TAGS]}]}"
          fi

          # 3. Send Apply Success Metric if apply ran
          if [ "${{ steps.apply.outcome }}" = "success" ]; then
            curl -s -X POST "https://api.${DATADOG_SITE}/api/v1/series" -H "DD-API-KEY: ${DD_API_KEY}" -H "Content-Type: application/json" \
              -d "{\"series\": [{\"metric\": \"terraform.apply_success\", \"points\": [[$TS, 1]], \"type\": \"count\", \"tags\": [$TAGS]}]}"
          fi

      - name: Send Failure Metric
        if: failure()
        shell: bash
        run: |
          TS=$(date +%s)
          TAGS="\"repo:${{ github.repository }}\",\"workflow:${{ github.workflow }}\",\"branch:${{ github.ref_name }}\",\"event:${{ github.event_name }}\""
          
          if [ "${{ steps.apply.outcome }}" = "failure" ]; then
            METRIC="terraform.apply_error"
          elif [ "${{ steps.plan.outcome }}" = "failure" ]; then
            METRIC="terraform.plan_error"
          else
            METRIC="terraform.pipeline_error"
          fi

          curl -s -X POST "https://api.${DATADOG_SITE}/api/v1/series" -H "DD-API-KEY: ${DD_API_KEY}" -H "Content-Type: application/json" \
            -d "{\"series\": [{\"metric\": \"$METRIC\", \"points\": [[$TS, 1]], \"type\": \"count\", \"tags\": [$TAGS]}]}"
  
  destroy:
    if: ${{ github.event.inputs.destroy == 'true' }}
    name: 🧨 Destruct Infra
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Execute Terraform Destroy
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform/state.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"
          terraform destroy -auto-approve