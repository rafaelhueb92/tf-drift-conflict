name: Terraform Drift + Apply + Datadog

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: 'Destruct?'
        required: true
        default: 'false'
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: [master]
  
permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    if: ${{ github.event.inputs.destroy == 'false' }}
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform/state.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -out=tfplan
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          [ "$exit_code" -eq 0 ] || [ "$exit_code" -eq 2 ] || exit 1

      - name: Terraform Apply
        id: apply
        if: steps.plan.outputs.exit_code == '2' || steps.plan.outputs.exit_code == '0'
        run: terraform apply -auto-approve tfplan

     
  destroy:
    if: ${{ github.event.inputs.destroy == 'true' }}
    name: 🧨 Destruct Infra
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Execute Terraform Destroy
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform/state.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"
          terraform destroy -auto-approve